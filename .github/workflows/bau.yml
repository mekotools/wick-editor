name: bau

# Baut das MekoTools-Abbild von Wick Editor und legt es nach
# ghcr.io/mekotools/wick-editor.
#
# Uebersetzt wird NICHT selbst: geholt wird der amtliche Bau des Projekts
# (Zweig `gh-pages` im Repo Wicklets/wick-editor) auf einen festgenagelten
# Commit. Der einzige Eingriff ist das Entfernen der Analyse-Zeile
# (`plausible.io`) aus index.html.
#
# Der Push MUSS aus diesem oeffentlichen Repo heraus passieren: nur so wird das
# Paket mit einem oeffentlichen Repo verknuepft und ist ohne Anmeldung ziehbar.

on:
  workflow_dispatch:
    inputs:
      quelle_commit:
        description: "Vollstaendige Kennung des Commits im Zweig gh-pages"
        required: true
        default: "b24d0de01006e3ce14ebfd7c3a6155b26d3126c7"
      tag:
        description: "Versionsetikett des Abbilds"
        required: true
        default: "1.19.3"

permissions:
  contents: read
  packages: write

jobs:
  bau:
    runs-on: ubuntu-latest
    steps:
      - name: Eigenes Repo holen
        uses: actions/checkout@v4

      - name: Amtlichen Bau holen (festgenagelter Commit)
        run: |
          set -eu
          git clone --filter=blob:none --no-checkout https://github.com/Wicklets/wick-editor.git quelle
          cd quelle
          git checkout --detach "${{ inputs.quelle_commit }}"
          echo "Kopf des Quellzweigs:"
          git log -1 --format='  %H %ci %s'
          rm -rf .git
          cd ..
          mv quelle seite

      - name: Fremdaufrufe entfernen und belegen
        run: |
          set -eu
          VORHER_BYTES=$(wc -c < seite/index.html)
          echo "index.html vorher : $(sha256sum seite/index.html | cut -d' ' -f1) (${VORHER_BYTES} Bytes)"

          echo "--- 1) Analyse-Aufruf in der Startseite (plausible.io) ---"
          # Der Bau ist EINE einzige Zeile (verkleinertes HTML). `sed /muster/d`
          # loescht deshalb die ganze Datei — hier wird nur das Script-Element
          # selbst entfernt, der Rest der Zeile bleibt stehen.
          sed -i -E 's#<script[^>]*plausible[^>]*></script>##g' seite/index.html
          NACHHER_BYTES=$(wc -c < seite/index.html)
          echo "index.html nachher: $(sha256sum seite/index.html | cut -d' ' -f1) (${NACHHER_BYTES} Bytes)"
          if [ "$NACHHER_BYTES" -lt 3000 ]; then
            echo "::error::index.html ist zerstoert (${NACHHER_BYTES} Bytes)"; exit 1
          fi
          if [ "$((VORHER_BYTES - NACHHER_BYTES))" -gt 300 ]; then
            echo "::error::Es wurden $((VORHER_BYTES - NACHHER_BYTES)) Bytes entfernt — zu viel"; exit 1
          fi
          if ! grep -q "<title>Wick Editor</title>" seite/index.html; then
            echo "::error::index.html ist nicht mehr die Startseite"; exit 1
          fi

          echo "--- 2) Google-Schriften in den Stilvorlagen ---"
          # Die Schriftenliste des Textwerkzeugs holte ueber 140 Schriftarten von
          # fonts.googleapis.com — bei jedem Aufruf. Entfernt; es gelten die
          # Schriften des Geraets (Nunito Sans und PT Mono liegen oertlich bei).
          ANZ_VOR=$(grep -o 'fonts\.googleapis\.com' seite/static/css/main.*.chunk.css | wc -l)
          sed -i -E 's#@import url\(https://fonts\.googleapis\.com[^)]*\);[[:space:]]*##g' seite/static/css/main.*.chunk.css
          sed -i -E 's#https://fonts\.googleapis\.com/css\?family=[A-Za-z0-9+&;=]*##g' seite/project-converter/index.html
          echo "Schrift-Abrufe vorher: $ANZ_VOR, nachher: $(grep -c 'fonts\.googleapis\.com' seite/static/css/main.*.chunk.css || true)"

          echo "--- 3) Zaehl-Aufrufe im Programmbau (Google Analytics) ---"
          ANZ_JS=$(grep -o 'www\.google-analytics\.com' seite/static/js/*.chunk.js | wc -l)
          sed -i -E 's#https://www\.google-analytics\.com/analytics(_debug)?\.js#about:blank#g' seite/static/js/*.chunk.js
          sed -i -E 's#https://www\.googletagmanager\.com/[A-Za-z0-9/._?=&-]*#about:blank#g' seite/static/js/*.chunk.js || true
          echo "Zaehl-Adressen vorher: $ANZ_JS, nachher: $(grep -o 'www\.google-analytics\.com' seite/static/js/*.chunk.js | wc -l)"

          echo "--- 4) Quellkarten entfernen (nur zum Nachsehen, enthalten die alten Adressen) ---"
          find seite -name '*.map' -print -delete

          echo "--- Gegenprobe: kein Werkzeug ruft noch einen fremden Wirt ab ---"
          if grep -rIl -E 'fonts\.googleapis|google-analytics|googletagmanager|plausible\.io' seite; then
            echo "::error::Es steht noch ein Fremdaufruf im Bau"; exit 1
          fi
          echo "sauber"
          echo "Dateien im Bau: $(find seite -type f | wc -l)"
          echo "Groesse des Baus: $(du -sh seite | cut -f1)"

      - name: Bauen
        run: |
          set -eu
          docker build -t "ghcr.io/mekotools/wick-editor:${{ inputs.tag }}" .

      - name: Anmelden und ablegen
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "ghcr.io/mekotools/wick-editor:${{ inputs.tag }}" ghcr.io/mekotools/wick-editor:latest
          docker push "ghcr.io/mekotools/wick-editor:${{ inputs.tag }}"
          docker push ghcr.io/mekotools/wick-editor:latest
          echo "Verdauungswert des abgelegten Abbilds:"
          docker inspect --format='  {{index .RepoDigests 0}}' ghcr.io/mekotools/wick-editor:latest
