server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Der Bau besteht aus fertigen Dateien: keine Verzeichnisliste, kein
    # Weiterschreiben, aber auch kein Zwischenspeichern der Startseite, damit
    # ein neuer Bau sofort ankommt.
    autoindex off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/wasm;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Startseite, Service-Arbeiter und Manifest nie zwischenspeichern.
    location = /index.html   { add_header Cache-Control "no-cache"; }
    location = /manifest.json { add_header Cache-Control "no-cache"; }
    location = /service-worker.js { add_header Cache-Control "no-cache"; }

    # Bausteine des Baus sind inhaltsbenannt (Hashes in den Dateinamen) und
    # duerfen lange liegen bleiben.
    location /static/  { add_header Cache-Control "public, max-age=604800"; }
    location /corelibs/ { add_header Cache-Control "public, max-age=604800"; }

    location / {
        try_files $uri $uri/ =404;
    }
}
